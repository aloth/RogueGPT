name: Publish to PyPI

# Runs on a v* tag. Builds the sdist and wheel, checks that the tag matches the
# version in pyproject.toml, publishes with PyPI trusted publishing (OIDC, no
# stored token), then lists the MCP server in the official MCP registry.
#
# A manual run (workflow_dispatch) skips build and PyPI and only lists the
# version in server.json in the MCP registry, for when that step failed after a
# successful PyPI release. It refuses unless that version is already on PyPI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches pyproject.toml and server.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SRV=$(jq -r '.version' server.json)
          echo "tag=$TAG pyproject=$PKG server.json=$SRV"
          test "$TAG" = "$PKG" && test "$TAG" = "$SRV"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The wheel must contain the package and its config, and nothing else at
      # the top level, so it never shadows modules of other packages.
      - name: Check the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          top = {n.split("/")[0] for n in names if not n.split("/")[0].endswith(".dist-info")}
          assert top == {"roguegpt"}, top
          assert "roguegpt/prompt_engine.json" in names
          print("\n".join(names))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Separate job, so a registry outage never blocks the PyPI release.
  publish-mcp-registry:
    needs: publish-pypi
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish-pypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v4

      - name: Check that the server.json version is on PyPI
        run: |
          V=$(jq -r '.version' server.json)
          curl --fail --silent --show-error "https://pypi.org/pypi/roguegpt/$V/json" > /dev/null
          echo "roguegpt $V is on PyPI"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # The registry checks the mcp-name line in the README published on PyPI,
      # which can take a minute to become visible after the upload.
      - name: Publish server to the MCP registry
        run: |
          for i in $(seq 1 6); do
            ./mcp-publisher publish && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1
